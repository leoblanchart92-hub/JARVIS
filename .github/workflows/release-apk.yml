name: Build APK and create version tag

on:
  push:
    branches: [main]
    paths:
      - ".github/RELEASE_NOW"
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier, sans le v (exemple : 1.0.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK, then tag and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate version
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          VERSION="$VERSION_INPUT"
          if [ -z "$VERSION" ]; then
            VERSION="$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\)+[0-9]*/\1/p' pubspec.yaml)"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version invalide. Utilise le format 1.0.1"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: |
          if [ ! -d android ]; then
            cp pubspec.yaml /tmp/jarvis-pubspec.yaml
            cp -R lib /tmp/jarvis-lib
            flutter create --platforms=android --project-name jarvis --org com.astra .
            cp /tmp/jarvis-pubspec.yaml pubspec.yaml
            rm -rf lib
            cp -R /tmp/jarvis-lib lib
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter project
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Publish release and create tag after successful build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: main
          name: ASTRA ${{ env.TAG }}
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/app-release.apk
