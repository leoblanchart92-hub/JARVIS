name: Publish Android APK release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: |
          if [ ! -d android ]; then
            cp pubspec.yaml /tmp/jarvis-pubspec.yaml
            cp -R lib /tmp/jarvis-lib
            flutter create --platforms=android --project-name jarvis --org com.astra .
            cp /tmp/jarvis-pubspec.yaml pubspec.yaml
            rm -rf lib
            cp -R /tmp/jarvis-lib lib
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/app-release.apk
