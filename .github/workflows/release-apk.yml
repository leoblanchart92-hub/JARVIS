name: Build APK and publish signed update

on:
  push:
    branches: [main]
    paths:
      - ".github/RELEASE_NOW"
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier, sans le v (exemple : 1.0.2)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, sign and publish ASTRA
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate version
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          VERSION="$VERSION_INPUT"
          if [ -z "$VERSION" ]; then
            VERSION="$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\)+[0-9]*/\1/p' pubspec.yaml)"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version invalide. Utilise le format 1.0.2"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Check signing key secret
        env:
          ASTRA_UPDATE_PRIVATE_KEY: ${{ secrets.ASTRA_UPDATE_PRIVATE_KEY }}
        run: |
          if [ -z "$ASTRA_UPDATE_PRIVATE_KEY" ]; then
            echo "::error::Le secret ASTRA_UPDATE_PRIVATE_KEY manque dans GitHub."
            exit 1
          fi
          printf '%s\n' "$ASTRA_UPDATE_PRIVATE_KEY" > /tmp/astra-update-private.pem
          openssl pkey -in /tmp/astra-update-private.pem -noout

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: |
          if [ ! -d android ]; then
            cp pubspec.yaml /tmp/jarvis-pubspec.yaml
            cp -R lib /tmp/jarvis-lib
            flutter create --platforms=android --project-name jarvis --org com.astra .
            cp /tmp/jarvis-pubspec.yaml pubspec.yaml
            rm -rf lib
            cp -R /tmp/jarvis-lib lib
          fi

      - name: Allow Android APK installation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()
          permission = '    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n'
          if "android.permission.REQUEST_INSTALL_PACKAGES" not in text:
              text = text.replace("<application", permission + "    <application", 1)
              path.write_text(text)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter project
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare and sign update manifest
        run: |
          mkdir -p updates
          cp build/app/outputs/flutter-apk/app-release.apk ASTRA.apk
          SHA256="$(sha256sum ASTRA.apk | cut -d ' ' -f 1)"
          echo "APK_SHA256=$SHA256" >> "$GITHUB_ENV"
          export APK_SHA256="$SHA256"
          python3 - <<'PY'
          import json, os
          manifest = {
              "version": os.environ["VERSION"],
              "apk_url": f"https://github.com/leoblanchart92-hub/Jarvis/releases/download/{os.environ['TAG']}/ASTRA.apk",
              "sha256": os.environ["APK_SHA256"],
              "notes": f"ASTRA {os.environ['TAG']}"
          }
          with open("updates/latest.json", "w", encoding="utf-8", newline="\n") as f:
              json.dump(manifest, f, ensure_ascii=False, separators=(",", ":"), sort_keys=True)
              f.write("\n")
          PY
          openssl pkeyutl -sign -rawin -inkey /tmp/astra-update-private.pem \
            -in updates/latest.json -out /tmp/latest.sig
          base64 -w 0 /tmp/latest.sig > updates/latest.sig
          echo >> updates/latest.sig

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: main
          name: ASTRA ${{ env.TAG }}
          generate_release_notes: true
          files: ASTRA.apk

      - name: Publish signed update manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/latest.json updates/latest.sig
          git commit -m "Publish signed ASTRA update ${TAG}"
          git push origin HEAD:main
