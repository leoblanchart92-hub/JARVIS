name: Build and publish ASTRA APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (ex: 1.0.2). Laisser vide pour pubspec.yaml."
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - ".github/RELEASE_NOW"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate version
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          VERSION="$VERSION_INPUT"
          if [ -z "$VERSION" ]; then
            VERSION="$(python3 -c "import re; s=open('pubspec.yaml').read(); m=re.search(r'^version:\s*([0-9]+\\.[0-9]+\\.[0-9]+)',s,re.M); print(m.group(1) if m else '')")"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version invalide"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name jarvis --org com.astra .
          fi

      - name: Add install permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          permission='    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n'
          if permission.strip() not in s:
              s=s.replace("<manifest", "<manifest", 1)
              s=s.replace("<application", permission+"    <application", 1)
              p.write_text(s)
          PY

      - name: Dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        run: flutter build apk --release

      - name: Verify APK exists
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          cp build/app/outputs/flutter-apk/app-release.apk ASTRA.apk
          test -s ASTRA.apk
          sha256sum ASTRA.apk

      - name: Prepare update manifest
        env:
          APK_SHA256: ${{ env.APK_SHA256 }}
        run: |
          SHA256="$(sha256sum ASTRA.apk | awk '{print $1}')"
          python3 - <<'PY'
          import json, os
          version=os.environ["VERSION"]
          tag=os.environ["TAG"]
          sha=os.popen("sha256sum ASTRA.apk").read().split()[0]
          manifest={
            "version":version,
            "apk_url":f"https://github.com/leoblanchart92-hub/Jarvis/releases/download/{tag}/ASTRA.apk",
            "sha256":sha,
            "notes":f"ASTRA {tag}"
          }
          os.makedirs("updates",exist_ok=True)
          with open("updates/latest.json","w",encoding="utf-8") as f:
            json.dump(manifest,f,ensure_ascii=False,separators=(",",":"))
            f.write("\n")
          PY

      - name: Publish release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: main
          name: ASTRA ${{ env.TAG }}
          generate_release_notes: true
          files: ASTRA.apk

      - name: Publish manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/latest.json
          if git diff --cached --quiet; then
            echo "Manifest already current"
          else
            git commit -m "Update ASTRA manifest for $TAG"
            git push origin HEAD:main
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ASTRA-${{ env.TAG }}-APK
          path: ASTRA.apk
          if-no-files-found: error
          retention-days: 14
