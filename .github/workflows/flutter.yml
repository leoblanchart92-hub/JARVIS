name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: astra-release
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build ASTRA APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: |
          if [ ! -d android ]; then
            cp pubspec.yaml /tmp/astra-pubspec.yaml
            cp -R lib /tmp/astra-lib
            flutter create --platforms=android --project-name jarvis --org com.astra .
            cp /tmp/astra-pubspec.yaml pubspec.yaml
            rm -rf lib
            cp -R /tmp/astra-lib lib
          fi

      - name: Set ASTRA app label and permissions
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          tree = ET.parse(path)
          root = tree.getroot()
          ns = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", ns)
          app = root.find("application")
          if app is None:
              raise SystemExit("AndroidManifest: application element missing")
          app.set(f"{{{ns}}}label", "ASTRA")
          required = {
              "android.permission.INTERNET",
              "android.permission.RECORD_AUDIO",
              "android.permission.REQUEST_INSTALL_PACKAGES",
          }
          present = {
              p.get(f"{{{ns}}}name")
              for p in root.findall("uses-permission")
          }
          for name in required - present:
              element = ET.Element("uses-permission")
              element.set(f"{{{ns}}}name", name)
              root.insert(0, element)
          tree.write(path, encoding="utf-8", xml_declaration=True)
          PY

      - name: Configure permanent APK signing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          ASTRA_KEYSTORE_BASE64: ${{ secrets.ASTRA_KEYSTORE_BASE64 }}
          ASTRA_KEYSTORE_PASSWORD: ${{ secrets.ASTRA_KEYSTORE_PASSWORD }}
          ASTRA_KEY_ALIAS: ${{ secrets.ASTRA_KEY_ALIAS }}
          ASTRA_KEY_PASSWORD: ${{ secrets.ASTRA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ASTRA_KEYSTORE_BASE64 ASTRA_KEYSTORE_PASSWORD ASTRA_KEY_ALIAS ASTRA_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret $name"; exit 1; fi
          done
          mkdir -p android/app
          python3 - <<'PY'
          import base64, os, re
          raw = os.environ["ASTRA_KEYSTORE_BASE64"]
          cleaned = re.sub(r"\\s+", "", raw)
          try:
              data = base64.b64decode(cleaned, validate=True)
          except Exception as exc:
              raise SystemExit("ASTRA_KEYSTORE_BASE64 is not valid Base64. Re-copy the secret from the keystore file.") from exc
          if not data.startswith(b"\xFE\xED\xFE\xED"):
              raise SystemExit("Decoded file does not appear to be a Java keystore (JKS).")
          with open("android/app/astra-release.jks", "wb") as f:
              f.write(data)
          PY
          keytool -list -keystore android/app/astra-release.jks -alias "$ASTRA_KEY_ALIAS" -storepass "$ASTRA_KEYSTORE_PASSWORD" >/dev/null
          echo "Keystore decoded and verified."
          cat > android/key.properties <<EOF
          storePassword=$ASTRA_KEYSTORE_PASSWORD
          keyPassword=$ASTRA_KEY_PASSWORD
          keyAlias=$ASTRA_KEY_ALIAS
          storeFile=astra-release.jks
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          s = s.replace("android {", """import java.util.Properties
          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystorePropertiesFile.inputStream().use { keystoreProperties.load(it) }
          }
          android {""", 1)
          s = s.replace("    buildTypes {", """    signingConfigs {
              create("astraRelease") {
                  keyAlias = keystoreProperties["keyAlias"] as String
                  keyPassword = keystoreProperties["keyPassword"] as String
                  storeFile = file(keystoreProperties["storeFile"] as String)
                  storePassword = keystoreProperties["storePassword"] as String
              }
          }
          buildTypes {""", 1)
          s = s.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("astraRelease")')
          releaseStart = s.find('release {', s.find('buildTypes {'))
          if releaseStart >= 0 and 'astraRelease' not in s[releaseStart:s.find('}', releaseStart)]:
              s = s[:releaseStart+len('release {')] + '\\n            signingConfig = signingConfigs.getByName("astraRelease")' + s[releaseStart+len('release {'):]
          p.write_text(s)
          print("Release signing configured.")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify and prepare APK
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          VERSION="$(awk '/^version:/{split($2,a,"+");print a[1]}' pubspec.yaml)"
          test -n "$VERSION"
          TAG="v$VERSION"
          cp "$APK" ASTRA.apk
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          sha256sum ASTRA.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ASTRA-Android-APK
          path: ASTRA.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: main
          name: ASTRA ${{ env.TAG }}
          generate_release_notes: true
          files: ASTRA.apk
