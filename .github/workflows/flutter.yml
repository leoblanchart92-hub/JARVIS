name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "updates/latest.json"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: astra-release
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build ASTRA APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate next release version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          git fetch --tags --force
          latest="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)"
          if [[ -z "$latest" ]]; then
            latest="v1.0.0"
          fi
          version="${latest#v}"
          IFS='.' read -r major minor patch <<< "$version"
          patch=$((patch + 1))
          next="${major}.${minor}.${patch}"
          echo "VERSION=$next" >> "$GITHUB_ENV"
          echo "TAG=v$next" >> "$GITHUB_ENV"
          echo "Next ASTRA release: v$next"

      - name: Set Flutter package version to release version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: |
          BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          sed -i -E "s/^version: .*/version: ${VERSION}+${BUILD_NUMBER}/" pubspec.yaml
          grep '^version:' pubspec.yaml

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: |
          if [ ! -d android ]; then
            cp pubspec.yaml /tmp/astra-pubspec.yaml
            cp -R lib /tmp/astra-lib
            flutter create --platforms=android --project-name jarvis --org com.astra .
            cp /tmp/astra-pubspec.yaml pubspec.yaml
            rm -rf lib
            cp -R /tmp/astra-lib lib
          fi

      - name: Set ASTRA app label and permissions
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          tree = ET.parse(path)
          root = tree.getroot()
          ns = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", ns)
          app = root.find("application")
          if app is None:
              raise SystemExit("AndroidManifest: application element missing")
          app.set(f"{{{ns}}}label", "ASTRA")
          required = {
              "android.permission.INTERNET",
              "android.permission.RECORD_AUDIO",
              "android.permission.REQUEST_INSTALL_PACKAGES",
          }
          present = {
              p.get(f"{{{ns}}}name")
              for p in root.findall("uses-permission")
          }
          for name in required - present:
              element = ET.Element("uses-permission")
              element.set(f"{{{ns}}}name", name)
              root.insert(0, element)
          tree.write(path, encoding="utf-8", xml_declaration=True)
          PY

      - name: Configure stable release signing
        env:
          ASTRA_KEYSTORE_BASE64: ${{ secrets.ASTRA_KEYSTORE_BASE64 }}
          ASTRA_KEYSTORE_PASSWORD: ${{ secrets.ASTRA_KEYSTORE_PASSWORD }}
          ASTRA_KEY_ALIAS: ${{ secrets.ASTRA_KEY_ALIAS }}
          ASTRA_KEY_PASSWORD: ${{ secrets.ASTRA_KEY_PASSWORD }}
        run: |
          set -e
          test -n "$ASTRA_KEYSTORE_BASE64" || { echo "Missing ASTRA_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$ASTRA_KEYSTORE_PASSWORD" || { echo "Missing ASTRA_KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$ASTRA_KEY_ALIAS" || { echo "Missing ASTRA_KEY_ALIAS secret"; exit 1; }
          test -n "$ASTRA_KEY_PASSWORD" || { echo "Missing ASTRA_KEY_PASSWORD secret"; exit 1; }
          echo "$ASTRA_KEYSTORE_BASE64" | base64 --decode > android/app/astra-release.jks
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          android_marker = "android {"
          signing_block = '''
              signingConfigs {
                  create("astraRelease") {
                      storeFile = file("astra-release.jks")
                      storePassword = System.getenv("ASTRA_KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("ASTRA_KEY_ALIAS")
                      keyPassword = System.getenv("ASTRA_KEY_PASSWORD")
                  }
              }
          '''
          if 'astraRelease' not in s:
              s = s.replace(android_marker, android_marker + signing_block, 1)
          s = s.replace('signingConfig = signingConfigs.getByName("debug")',
                      'signingConfig = signingConfigs.getByName("astraRelease")')
          p.write_text(s)
          PY
          keytool -list -keystore android/app/astra-release.jks -storepass "$ASTRA_KEYSTORE_PASSWORD" -alias "$ASTRA_KEY_ALIAS" >/dev/null
          echo "Stable ASTRA release signing configured."

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify and prepare APK
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          cp "$APK" ASTRA.apk
          sha256sum ASTRA.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ASTRA-${{ env.TAG }}-APK
          path: ASTRA.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: main
          name: ASTRA ${{ env.TAG }}
          generate_release_notes: true
          files: ASTRA.apk
