name: Flutter setup

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  flutter:
    name: Set up Flutter
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter installation
        run: flutter --version

      - name: Install dependencies
        if: hashFiles('pubspec.yaml') != ''
        run: flutter pub get

      - name: Analyze project
        if: hashFiles('pubspec.yaml') != ''
        run: flutter analyze

      - name: Run tests
        if: hashFiles('pubspec.yaml') != ''
        run: flutter test
